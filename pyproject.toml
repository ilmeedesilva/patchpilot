[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
dynamic = ["version"]
description = "An AI agent that upgrades your dependencies, fixes what breaks, and opens a PR"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilmee De Silva" }]
requires-python = ">=3.11"
keywords = ["ai-agent", "dependencies", "upgrade", "llm", "claude", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "anthropic>=2.3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/ilmeedesilva/patchpilot"
Issues = "https://github.com/ilmeedesilva/patchpilot/issues"
Demo = "https://github.com/ilmeedesilva/patchpilot-demo"

[project.scripts]
patchpilot = "patchpilot.cli:main"

[tool.hatch.version]
path = "src/patchpilot/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["examples", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
